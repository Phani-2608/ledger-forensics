name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest tests/ -q
      - name: Smoke run rebuilds everything from nothing
        run: python run.py smoke
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.python-version }}
          path: artifacts/
