services:
  api:
    build: .
    command: python run.py api
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts"]

  dashboard:
    build: .
    command: >
      streamlit run dashboard/app.py
      --server.port=8501 --server.address=0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./artifacts:/app/artifacts"]
